name: Update Personal Statistics

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'stats.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/main.yml'
  schedule:
    # Monthly, on the 1st at 08:23 China time (00:23 UTC).
    - cron: '23 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.7'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify collection and publication
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Collect statistics and generate cards
        run: uv run --frozen python generate_images.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}

      - name: Publish validated statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- generated/languages.svg generated/overview.svg generated/stats.json
          if git diff --cached --quiet; then
            echo 'Statistics are unchanged.'
            exit 0
          fi
          git commit -m 'chore: update personal statistics'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
